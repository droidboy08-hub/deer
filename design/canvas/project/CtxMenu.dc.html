<div style="position: relative; padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<sc-if value="{{row.isSep}}" hint-placeholder-val="{{false}}"><div role="separator" style="height: 9px; display: flex; align-items: center"><div style="flex-grow: 1; height: 1px; margin: 0 6px; background: {{t.sep}}"></div></div></sc-if>
<sc-if value="{{row.isCap}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="height: 28px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; font-size: 12px; line-height: 16px; color: {{t.sec}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.label}}</div></sc-if>
<sc-if value="{{row.isItem}}" hint-placeholder-val="{{true}}"><div role="{{row.role}}" aria-disabled="{{row.ariaDis}}" aria-checked="{{row.ariaChecked}}" aria-keyshortcuts="{{row.aks}}" style="position: relative; height: {{rowH}}px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 12px; color: {{row.color}}; opacity: {{row.op}}">
<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="{{row.d}}"></path><path d="{{row.d2}}" stroke-opacity="0.45"></path></svg>
<span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; font-weight: {{row.fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.pre}}<span style="text-decoration: {{row.ud}}; text-decoration-thickness: 1px; text-underline-offset: 2px">{{row.k}}</span>{{row.post}}</span>
<sc-if value="{{row.hasAccel}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; margin-left: 20px; font-size: 12px; line-height: 16px; color: {{row.accColor}}; white-space: nowrap">{{row.accel}}</span></sc-if>
</div></sc-if>
</sc-for>
</div>
</div>
</x-dc>

const plateTr = glide ? 'top 90ms ' + S2 + ', background 80ms ease, opacity 60ms ease' : (hover >= 0 ? 'opacity 60ms ease' : 'opacity 120ms ease');

return {
ariaLabel: kind === 'circle' ? caption : 'Context',
w: w, h: h, t: t, rows: rows, rowH: rowH,
plate: { top: plateTop, w: w - 12, h: rowH, bg: plateBg, inset: plateIn, op: hovRow ? 1 : 0, tr: plateTr }
};
}
}
</script>
</body>
