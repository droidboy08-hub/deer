['down', 7600, { bHover: 1, key: 'Down', line: 'The plate glides to the next item.' }],
['keyE', 8300, { bHover: 3, bPressed: true, key: 'E', line: 'An access key runs its item at once: Copy link address. No toast; the link keeps focus.' }],
['chosenB', 8420, { B: 'chosen', wash38: false }],
['moveC', 9300, { cur: [1398, 858], key: 'Right-click near the corner', line: 'There is no room below or to the right, so the menu opens up and to the left. Its rows keep their order.' }],
['rcC', 9900, { press: true, focus38: false }],
['menuC', 10000, { press: false, C: 'open' }],
['escC', 11100, { C: 'dismissed', key: 'Esc', line: 'Dismissed with a 120 ms fade. Focus goes back where it was.' }]
];
}

run() {
(this.timers || []).forEach((t) => clearTimeout(t));
if ((this.props.autoplay ?? true) === false) return;
this.timers = [];
this.setState({ phase: 'idle', snap: true, still: false });
this.timers.push(setTimeout(() => this.setState({ snap: false }), 80));
this.plan().forEach((p) => {
if (p[1] > 0) this.timers.push(setTimeout(() => this.setState({ phase: p[0] }), p[1]));
});
this.timers.push(setTimeout(() => this.run(), 12300));
}

renderVals() {
const plan = this.plan();
const ph = this.state.phase;
const snap = this.state.snap;
const v = {};
let at = 0;
for (let i = 0; i < plan.length; i += 1) {
Object.assign(v, plan[i][2]);
if (plan[i][0] === ph) { at = plan[i][1]; break; }
}
const S = 'cubic-bezier(0.22, 1, 0.36, 1)';
const E = 'cubic-bezier(0.2, 0, 0, 1)';
const tr = (s) => (snap ? 'none' : s);

const menu = (st, down) => {
const closedTf = down ? 'translateY(-4px) scale(0.96)' : 'translateY(4px) scale(0.96)';
if (st === 'open') return { op: 1, tf: 'translateY(0px) scale(1)', tr: tr('opacity 90ms ' + E + ', transform 200ms ' + S) };
if (st === 'chosen') return { op: 0, tf: 'translateY(0px) scale(1)', tr: tr('opacity 100ms ease') };
if (st === 'dismissed') return { op: 0, tf: 'translateY(0px) scale(0.985)', tr: tr('opacity 120ms cubic-bezier(0.4, 0, 1, 1), transform 120ms cubic-bezier(0.4, 0, 1, 1)') };
return { op: 0, tf: closedTf, tr: 'none' };
};
const mA = Object.assign(menu(v.A, true), { hover: v.aHover, pressed: v.aPressed });
const mB = Object.assign(menu(v.B, true), { hover: v.bHover, pressed: v.bPressed });
const mC = Object.assign(menu(v.C, false), { hover: v.cHover });

const linkRect = { l: 86, t: 315, w: 382, h: 20, r: 6 };
const openRect = { l: 200, t: 72, w: 1040, h: 804, r: 22 };
const isOpen = v.peek === 'open' || v.peek === 'loaded';
const sheet = Object.assign({ o: isOpen ? 1 : 0 }, isOpen ? openRect : linkRect);
let trSheet = 'left 400ms ' + S + ', top 400ms ' + S + ', width 400ms ' + S + ', height 400ms ' + S + ', border-radius 400ms ' + S + ', opacity 80ms ease';
if (v.peek === 'closing') trSheet = 'left 280ms ' + S + ', top 280ms ' + S + ', width 280ms ' + S + ', height 280ms ' + S + ', border-radius 280ms ' + S + ', opacity 120ms ease 180ms';
if (v.peek === 'hidden') trSheet = 'none';

return {
v: v,
hover39: v.hover39 ? 1 : 0,
trHover: tr(ph === 'move1' ? 'opacity 160ms ease 320ms' : 'opacity 160ms ease'),
wash39: v.wash39 ? 1 : 0,
wash38: v.wash38 ? 1 : 0,
trWash: tr('opacity 120ms ease'),
focus38: v.focus38 ? 1 : 0,
trFocus: tr('opacity 100ms ease'),
closeWash: (ph === 'esc1' || ph === 'park') && !snap ? 'vt-wash 1120ms ease-out 260ms both' : 'none',
scrim: isOpen ? 1 : 0,
trScrim: tr('opacity 240ms ease'),
sheet: sheet,
trSheet: tr(trSheet),
cover: (v.peek === 'open' || v.peek === 'hidden') ? 1 : 0,
trFade: tr('opacity 200ms ease'),
loadW: v.peek === 'open' ? '70%' : (v.peek === 'loaded' ? '100%' : '0%'),
loadOp: v.peek === 'open' ? 1 : 0,
trLoad: tr('width 450ms ease, opacity 250ms ease 300ms'),
barOp: isOpen ? 1 : 0,
barTf: isOpen ? 'translateY(0px)' : 'translateY(-10px)',
trBar: tr(v.peek === 'closing' ? 'opacity 220ms ease 300ms, transform 320ms ' + S + ' 300ms' : 'opacity 220ms ease, transform 320ms ' + S),
mA: mA,
mB: mB,
mC: mC,
cur: { x: v.cur[0], y: v.cur[1], s: v.press ? 0.86 : 1 },
trCursor: tr('left 480ms cubic-bezier(0.3, 0, 0.2, 1), top 480ms cubic-bezier(0.3, 0, 0.2, 1), transform 120ms ease'),
clock: this.state.still ? 'Still' : (at / 1000).toFixed(1) + ' s'
};
}
}
</script>
