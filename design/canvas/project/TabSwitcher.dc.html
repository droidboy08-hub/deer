<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true,"section":"Motion"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
state = { sel: 1, dir: 1, opening: false, tick: 0 };

componentDidMount() {
this.startTimer();
}

componentWillUnmount() {
clearInterval(this.timer);
clearTimeout(this.openTimer);
clearTimeout(this.stepTimer);
}

startTimer() {
clearInterval(this.timer);
this.timer = setInterval(() => this.step(), 2100);
}

reducedMotion() {
return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

step() {
if ((this.props.autoplay ?? true) === false || this.state.opening || this.reducedMotion()) return;
const tick = this.state.tick + 1;
if (tick % 4 === 0) {
this.setState({ tick: tick });
this.open();
return;
}
let dir = this.state.dir;
let next = this.state.sel + dir;
if (next > 5 || next < 0) {
dir = -dir;
next = this.state.sel + dir;
}
this.setState({ tick: tick, sel: next, dir: dir });
}

open() {
this.setState({ opening: true });
clearTimeout(this.openTimer);
this.openTimer = setTimeout(() => this.setState({ opening: false }), 1300);
}

pick(i) {
if (this.state.opening) return;
this.startTimer();
clearTimeout(this.stepTimer);
this.setState({ tick: 0 });
if (i === this.state.sel) {
this.open();
return;
}
const go = () => {
const s = this.state.sel;
if (s === i) return;
this.setState({ sel: s + Math.sign(i - s) });
this.stepTimer = setTimeout(go, 140);
};
go();
}

renderVals() {
const sel = this.state.sel;
const opening = this.state.opening;
const spring = 'cubic-bezier(0.22, 1, 0.36, 1)';
const card = (i) => {
const d = i - sel;
const isSel = d === 0;
let transform = 'translateX(' + (d * 912) + 'px) scale(' + (isSel ? 1 : 0.86) + ')';
if (opening && isSel) transform = 'translateY(20px) scale(1.6667)';
let tr = 'transform 560ms ' + spring + ', opacity 320ms ease';
if (opening) tr = isSel ? 'transform 360ms cubic-bezier(0.2, 0, 0, 1), opacity 220ms ease' : 'transform 560ms ' + spring + ', opacity 220ms ease';
return {
transform: transform,
tr: tr,
opacity: opening && !isSel ? 0 : (Math.abs(d) > 1 ? 0 : 1),
z: isSel ? 10 : 5 - Math.abs(d),
dim: isSel ? 0 : 0.5,
radius: opening && isSel ? 0 : 22,
chrome: opening && isSel ? 0 : 1,
label: opening ? 0 : (isSel ? 1 : 0.5),
dockW: isSel ? 216 : 40,
dockBg: isSel ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0)',
dockText: isSel ? 1 : 0,
current: isSel ? 'true' : 'false',
pick: () => this.pick(i)
};
};
return {
c0: card(0), c1: card(1), c2: card(2), c3: card(3), c4: card(4), c5: card(5),
dockOpacity: opening ? 0 : 1,
dockTransform: opening ? 'translateY(18px)' : 'translateY(0px)'
};
}
}
