<button aria-label="Close find" class="vt-m" style="position: absolute; left: 442px; top: 8px; width: 28px; height: 28px; border: 0; border-radius: 14px; padding: 0; background: {{btn.closeBg}}; color: {{t.icon}}; display: flex; align-items: center; justify-content: center; opacity: {{x.op}}; transform: {{x.tf}}; transition: {{tr.x}}"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"></path></svg></button>

</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"pill","options":["pill","capsule"],"section":"Find"},"face":{"editor":"enum","default":"find","options":["address","find"],"section":"Find"},"theme":{"editor":"enum","default":"light","options":["light","dark","clear"],"section":"Find"},"site":{"editor":"enum","default":"fieldnotes","options":["fieldnotes","tideline","refract","vitre","lec"],"section":"Find"},"query":{"editor":"text","default":"float","section":"Find"},"status":{"editor":"enum","default":"count","options":["count","none","blank"],"section":"Find"},"ord":{"editor":"text","default":"3","section":"Find"},"total":{"editor":"text","default":"7","section":"Find"},"focused":{"editor":"boolean","default":true,"section":"State"},"selected":{"editor":"boolean","default":false,"section":"State"},"caseOn":{"editor":"boolean","default":false,"section":"State"},"ime":{"editor":"boolean","default":false,"section":"State"},"loading":{"editor":"boolean","default":false,"section":"State"},"mark":{"editor":"boolean","default":false,"section":"State"},"hoverBtn":{"editor":"enum","default":"none","options":["none","prev","next","case","close"],"section":"State"},"echo":{"editor":"enum","default":"none","options":["none","prev","next"],"section":"State"},"prevOrd":{"editor":null,"default":""},"roll":{"editor":null,"default":"none"},"rollKey":{"editor":null,"default":"a"},"pulse":{"editor":null,"default":false},"snap":{"editor":null,"default":true},"$preview":{"width":480,"height":44}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props;
const variant = p.variant ?? 'pill';
const face = p.face ?? 'find';
const theme = p.theme ?? 'light';
const site = p.site ?? 'fieldnotes';
const query = p.query ?? 'float';
const status = p.status ?? 'count';
const ord = String(p.ord ?? '3');
const total = String(p.total ?? '7');
const focused = !!(p.focused ?? true);
const selected = !!(p.selected ?? false);
const caseOn = !!(p.caseOn ?? false);
const ime = !!(p.ime ?? false);
const hoverBtn = p.hoverBtn ?? 'none';
const echo = p.echo ?? 'none';
const roll = p.roll ?? 'none';
const rollKey = p.rollKey === 'b' ? 'b' : 'a';
const snap = !!(p.snap ?? true);
const S = 'cubic-bezier(0.22, 1, 0.36, 1)';
const find = face === 'find';
const tr = (s) => (snap ? 'none' : s);

const domains = { fieldnotes: 'fieldnotes.press', tideline: 'tideline.fm', refract: 'refract.wiki', vitre: 'code.vitre.dev', lec: 'longexposure.club' };
const domain = domains[site] || domains.fieldnotes;
const domW = { fieldnotes: 96, tideline: 65.7, refract: 67.7, vitre: 85.8, lec: 112.8 };
const groupW = 24 + (domW[site] || domW.fieldnotes);
const favAddr = Math.round(76 + (328 - groupW) / 2);

const light = theme === 'light';
const T = {
light: { base: 'linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.22))', focus: 'linear-gradient(180deg, rgba(255,255,255,0.62), rgba(255,255,255,0.40))', rim: 'linear-gradient(165deg, rgba(255,255,255,0.95), rgba(255,255,255,0.35) 30%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.8))', shadow: '0 10px 28px rgba(40,30,15,0.14), 0 1px 2px rgba(40,30,15,0.18)', text: '#16181d', icon: 'rgba(22,24,29,0.78)', iconDis: 'rgba(22,24,29,0.28)', placeholder: 'rgba(22,24,29,0.45)', caret: '#005fb8', divider: 'rgba(22,24,29,0.12)', count: 'rgba(22,24,29,0.55)', none: '#c42b1c', textShadow: 'none', hover: 'rgba(22,24,29,0.06)', press: 'rgba(22,24,29,0.10)' },
dark: { base: 'linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)), rgba(16,16,20,0.3)', focus: 'linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)), rgba(16,16,20,0.46)', rim: 'linear-gradient(165deg, rgba(255,255,255,0.7), rgba(255,255,255,0.12) 30%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.35))', shadow: '0 10px 28px rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.3)', text: '#ffffff', icon: 'rgba(255,255,255,0.85)', iconDis: 'rgba(255,255,255,0.3)', placeholder: 'rgba(255,255,255,0.45)', caret: '#4cc2ff', divider: 'rgba(255,255,255,0.12)', count: 'rgba(255,255,255,0.6)', none: '#ff99a4', textShadow: 'none', hover: 'rgba(255,255,255,0.10)', press: 'rgba(255,255,255,0.16)' },
clear: { base: 'linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04))', focus: 'linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)), rgba(16,16,20,0.30)', rim: 'linear-gradient(165deg, rgba(255,255,255,0.75), rgba(255,255,255,0.14) 30%, rgba(255,255,255,0.06) 60%, rgba(255,255,255,0.38))', shadow: '0 10px 28px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.24)', text: '#ffffff', icon: 'rgba(255,255,255,0.9)', iconDis: 'rgba(255,255,255,0.32)', placeholder: 'rgba(255,255,255,0.5)', caret: '#4cc2ff', divider: 'rgba(255,255,255,0.12)', count: 'rgba(255,255,255,0.7)', none: '#ff99a4', textShadow: '0 1px 2px rgba(0,0,0,0.35)', hover: 'rgba(255,255,255,0.10)', press: 'rgba(255,255,255,0.16)' }
};
const t = T[theme] || T.light;

const isCount = status === 'count';
const isNone = status === 'none';
const countText = isCount ? ord + ' of ' + total : (isNone ? 'No matches' : '');
const cw = countText.length * 6.5;
const fieldW = Math.max(160, Math.round(324 - cw - 10 - 42));
const capCw = countText.length * 6.2;
const capFieldW = Math.max(120, Math.round(300 - capCw - 10 - 12));

const arrowsOn = isCount && query.length > 0;
const caseBg = caseOn ? (light ? 'rgba(0,95,184,0.12)' : 'rgba(76,194,255,0.24)') : (hoverBtn === 'case' ? t.hover : 'transparent');
const caseRing = caseOn ? (light ? 'inset 0 0 0 1px rgba(0,95,184,0.35)' : 'inset 0 0 0 1px rgba(76,194,255,0.45)') : 'none';
const caseColor = caseOn ? (light ? '#005fb8' : '#9fe3ff') : t.text;

const inAnim = snap || roll === 'none' ? 'none' : 'vt-in-' + roll + '-' + rollKey + ' 160ms ' + S + ' both';
const outAnim = snap || roll === 'none' ? 'none' : 'vt-out-' + roll + '-' + rollKey + ' 120ms ease both';

return {
isPill: variant !== 'capsule',
isCapsule: variant === 'capsule',
box: variant === 'capsule' ? { w: 440, h: 32 } : { w: 480, h: 44 },
searchLabel: find ? 'Find on page' : 'Address',
t: t,
domain: domain,
query: query,
mark: !!(p.mark ?? false) && !find,
loading: !!(p.loading ?? false),
ord: ord,
prevOrd: String(p.prevOrd ?? ''),
total: total,
caseOnStr: caseOn ? 'true' : 'false',
fav: { l: find ? 16 : favAddr, fieldnotes: site === 'fieldnotes', tideline: site === 'tideline', refract: site === 'refract', vitre: site === 'vitre', lec: site === 'lec' },
dom: { l: find ? 42 : favAddr + 24, op: find ? 0 : 1 },
nav: { op: find ? 0 : 1, tf: find ? 'translateX(-6px)' : 'translateX(0px)' },
rel: { op: find ? 0 : 1, tf: find ? 'rotate(-90deg)' : 'rotate(0deg)' },
x: { op: find ? 1 : 0, tf: find ? 'rotate(0deg)' : 'rotate(45deg)' },
grp: { op: find ? 1 : 0, tf: find ? 'translateX(0px)' : 'translateX(8px)' },
tint: { base: find && focused ? 0 : 1, focus: find && focused ? 1 : 0 },
field: {
w: fieldW,
op: find ? 1 : 0,
empty: query.length === 0,
caret: find && focused && !selected,
selBg: selected ? 'rgba(76,194,255,0.42)' : 'transparent',
ime: ime ? 'underline' : 'none',
queryOp: find && !focused ? 0.85 : 1
},
capField: { w: capFieldW },
cnt: {
isCount: isCount && query.length > 0,
isNone: isNone,
color: isNone ? t.none : t.count,
op: ime ? 0.5 : 1,
inAnim: inAnim,
outAnim: outAnim,
pulse: !snap && p.pulse ? 'vt-pulse-' + rollKey + ' 160ms ease both' : 'none'
},
btn: {
arrowOp: arrowsOn ? 1 : 0.28,
prevBg: echo === 'prev' ? t.press : (hoverBtn === 'prev' ? t.hover : 'transparent'),
nextBg: echo === 'next' ? t.press : (hoverBtn === 'next' ? t.hover : 'transparent'),
prevTf: echo === 'prev' ? 'scale(0.94)' : 'scale(1)',
nextTf: echo === 'next' ? 'scale(0.94)' : 'scale(1)',
caseBg: caseBg,
caseRing: caseRing,
caseColor: caseColor,
caseOp: caseOn ? 1 : 0.7,
closeBg: hoverBtn === 'close' ? t.hover : 'transparent'
},
tr: {
tint: tr(find ? 'opacity 200ms ease' : 'opacity 160ms ease'),
nav: tr(find ? 'opacity 100ms ease, transform 100ms ease' : 'opacity 120ms ease 80ms, transform 120ms ' + S + ' 80ms'),
fav: tr(find ? 'left 240ms ' + S : 'left 200ms ' + S),
dom: tr(find ? 'left 240ms ' + S + ', opacity 120ms ease 60ms' : 'left 200ms ' + S + ', opacity 120ms ease 60ms'),
field: tr(find ? 'opacity 120ms ease 60ms' : 'opacity 80ms ease'),
grp: tr(find ? 'opacity 180ms ease 60ms, transform 180ms ' + S + ' 60ms' : 'opacity 90ms ease, transform 90ms ease'),
rel: tr(find ? 'opacity 120ms ease, transform 120ms ease' : 'opacity 120ms ease 80ms, transform 120ms ' + S + ' 80ms'),
x: tr(find ? 'opacity 160ms ease 60ms, transform 160ms ' + S + ' 60ms' : 'opacity 100ms ease, transform 100ms ease')
}
};
}
}
</script>
