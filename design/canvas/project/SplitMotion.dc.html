cur: { x: cur[0], y: cur[1], s: v.press ? 0.86 : 1, op: bare ? 0 : 1, arrow: v.kind === 'arrow' ? 1 : 0, ew: v.kind === 'ew' ? 1 : 0, anim: v.dbl && !snap ? 'vt-dbl 300ms ease both' : 'none' },
trCursor: dragging ? 'none' : tr('left 480ms cubic-bezier(0.3, 0, 0.2, 1), top 480ms cubic-bezier(0.3, 0, 0.2, 1), transform 120ms ease'),
clock: still ? 'Still' : (at / 1000).toFixed(1) + ' s'
};
}
}
