<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peek open over a page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #f6f7f9">
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px"><dc-import name="PeekMotion" autoplay="{{false}}" still="open" hint-size="1440px,900px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
