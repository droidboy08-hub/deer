<html lang="en">
<head>

<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #2b2a2e; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
<svg width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden" aria-hidden="true" focusable="false">
<defs>
<filter id="lens-dlpop" x="0" y="0" width="360" height="300" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feImage href="/_blob/3ea81efafa2bee38284e9cec583eaaa6" x="0" y="0" width="360" height="300" preserveAspectRatio="none" result="map"></feImage>
<feGaussianBlur in="SourceGraphic" stdDeviation="14" result="soft"></feGaussianBlur>
<feDisplacementMap in="soft" in2="map" scale="24" xChannelSelector="R" yChannelSelector="G" result="bent"></feDisplacementMap>
<feColorMatrix in="bent" type="saturate" values="1.6"></feColorMatrix>

</defs>

<section aria-label="Downloads" style="position: absolute; left: 1060px; top: 524px; width: 360px; height: 300px; border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.25)">
<div style="position: absolute; inset: 0; border-radius: 20px; backdrop-filter: url(#lens-dlpop)"></div>
<div style="position: absolute; inset: 0; border-radius: 20px; background: rgba(22,22,26,0.52)"></div>
<div style="position: absolute; inset: 0; border-radius: 20px; padding: 1px; background: linear-gradient(165deg, rgba(255,255,255,0.5), rgba(255,255,255,0.1) 30%, rgba(255,255,255,0.04) 60%, rgba(255,255,255,0.22)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude"></div>
<div style="position: relative; height: 300px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column">

<div style="height: 32px; padding: 0 4px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 14px; font-weight: 600">Downloads</span>
<span style="font-size: 12px; color: rgba(255,255,255,0.6)">2 active · 26.1 MB/s</span>
</div>

<div style="margin-top: 6px; height: 68px; box-sizing: border-box; padding: 8px 4px; display: flex; align-items: center; gap: 12px">
<span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; background: rgba(255,255,255,0.12)">MP4</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">float-line-tour-4k.mp4</span>
<div style="display: flex; gap: 2px; height: 5px">
<sc-for list="{{segments}}" as="seg" hint-placeholder-count="8">
<div style="flex-grow: 1; height: 5px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,0.14)"><div style="width: {{seg.fill}}%; height: 5px; background: #4cc2ff"></div></div>
</sc-for>
</div>
<span style="font-size: 12px; color: rgba(255,255,255,0.6)">512 MB of 1.2 GB · 18.4 MB/s · 38 s left</span>
</div>
<button aria-label="Pause float-line-tour-4k.mp4" style="flex-shrink: 0; width: 28px; height: 28px; border: 0; padding: 0; border-radius: 14px; background: rgba(255,255,255,0.1); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3.4" height="12" rx="1"></rect><rect x="11.6" y="4" width="3.4" height="12" rx="1"></rect></svg></button>
</div>

<div style="height: 1px; margin: 0 4px; background: rgba(255,255,255,0.08)"></div>

<div style="height: 68px; box-sizing: border-box; padding: 8px 4px; display: flex; align-items: center; gap: 12px">
<span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; background: rgba(255,255,255,0.12)">ZIP</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">photos-archive-2026.zip</span>
<div style="height: 5px; border-radius: 2px; background: rgba(255,255,255,0.14)"><div style="width: 12%; height: 5px; border-radius: 2px; background: #4cc2ff"></div></div>
<span style="font-size: 12px; color: rgba(255,255,255,0.6)">410 MB of 3.4 GB · 7.7 MB/s · 6 min left</span>
</div>
<button aria-label="Pause photos-archive-2026.zip" style="flex-shrink: 0; width: 28px; height: 28px; border: 0; padding: 0; border-radius: 14px; background: rgba(255,255,255,0.1); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3.4" height="12" rx="1"></rect><rect x="11.6" y="4" width="3.4" height="12" rx="1"></rect></svg></button>
</div>

<div style="height: 1px; margin: 0 4px; background: rgba(255,255,255,0.08)"></div>

<div style="height: 48px; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 12px">
<span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; background: rgba(255,255,255,0.12)">PDF</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">field-notes-issue-14.pdf</span>
<span style="font-size: 12px; color: rgba(255,255,255,0.6)">24 MB · Completed</span>
</div>
<button aria-label="Show field-notes-issue-14.pdf in folder" style="flex-shrink: 0; width: 28px; height: 28px; border: 0; padding: 0; border-radius: 14px; background: rgba(255,255,255,0.1); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1.5 1.5 0 0 1 1.5-1.5h3.3l1.7 1.8h6A1.5 1.5 0 0 1 17 7.8v6.7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z"></path></svg></button>

<button style="margin-top: auto; height: 36px; border: 0; border-radius: 10px; background: rgba(255,255,255,0.1); color: #ffffff; font: inherit; font-size: 13px">Open Downloads</button>

</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

return {
segments: [72, 60, 55, 48, 40, 30, 25, 14].map((f) => ({ fill: f }))
