<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true,"section":"Motion"},"still":{"editor":"enum","default":"open","options":["open","step","closed"],"section":"Motion"},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
state = { phase: 'idle', snap: true, still: false };

componentDidMount() {
this.timers = [];
const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
if ((this.props.autoplay ?? true) && !reduced) {
this.run();
} else {
const map = { open: 'ring1', step: 'step6', closed: 'close' };
this.setState({ phase: map[this.props.still ?? 'open'] || 'ring1', snap: true, still: true });
}
}

componentWillUnmount() {
(this.timers || []).forEach((t) => clearTimeout(t));
}

componentDidUpdate(prev) {
if (prev && (prev.autoplay !== this.props.autoplay || prev.still !== this.props.still)) {
(this.timers || []).forEach((t) => clearTimeout(t));
this.componentDidMount();
}
}

plan() {
return [
['idle', 0, { face: 'address', query: '', status: 'blank', ord: '1', prevOrd: '', roll: 'none', rollKey: 'a', echo: 'none', qsel: false, find: false, active: 1, ring: 'none', selected: false, scroll: 76, key: 'Reading', line: 'Field Notes, with the tab bar showing. Everything below is done from the keyboard.' }],
['open', 700, { face: 'find', key: 'Ctrl+F', line: 'The pill becomes the find field in place: Back and Forward fade, reload turns into ×, the favicon slides left. 240 ms. The field has focus from the first frame.' }],
['t1', 1300, { query: 'f' }],
['t2', 1360, { query: 'fl' }],
['t3', 1420, { query: 'flo', status: 'count', ord: '1', find: true, active: 1, key: 'Typing', line: 'Matches highlight as you type, in Chromium’s own yellow; the active one is orange.' }],
['t4', 1480, { query: 'floa' }],
['typed', 1540, { query: 'float' }],
['ring1', 1940, { ring: 'a', line: 'After a 400 ms pause the ring lands on the active match: 280 ms in, then it fades.' }],
['s2', 2900, { ord: '2', prevOrd: '1', roll: 'up', rollKey: 'b', echo: 'next', active: 2, ring: 'b', key: 'Enter', line: 'Next match. The count rolls up and the ring lands. The page stays put because the match is already in view.' }],
['e2', 3000, { echo: 'none' }],
['s3', 3700, { ord: '3', prevOrd: '2', roll: 'up', rollKey: 'a', echo: 'next', active: 3, ring: 'a' }],
['e3', 3800, { echo: 'none' }],
['b2', 4500, { ord: '2', prevOrd: '3', roll: 'down', rollKey: 'b', echo: 'prev', active: 2, ring: 'b', key: 'Shift+Enter', line: 'Previous match. The count rolls down.' }],
['eb2', 4600, { echo: 'none' }],
['b1', 5300, { ord: '1', prevOrd: '2', roll: 'down', rollKey: 'a', echo: 'prev', active: 1, ring: 'a' }],
['eb1', 5400, { echo: 'none' }],
['wrap', 6100, { ord: '7', prevOrd: '1', roll: 'up', rollKey: 'b', echo: 'prev', active: 7, ring: 'b', key: 'Shift+Enter, wrapping', line: 'From the first match it wraps to the last. The count rolls the other way: that is the only wrap cue on screen.' }],
['ew', 6200, { echo: 'none' }],
['step6', 6900, { ord: '6', prevOrd: '7', roll: 'down', rollKey: 'a', echo: 'prev', active: 6, ring: 'a', scroll: 595, key: 'Shift+Enter', line: 'Match 6 is off-screen, so the page jumps to it at once. Vitre never smooths this jump.' }],
['e6', 7000, { echo: 'none' }],
['close', 8100, { face: 'address', find: false, selected: true, ring: 'none', roll: 'none', key: 'Esc', line: 'Find closes in 200 ms. The match stays selected and has focus, so Ctrl+C copies it, or Enter follows it if it is a link.' }],
['reopen', 9500, { face: 'find', find: true, selected: false, qsel: true, prevOrd: '', key: 'Ctrl+F again', line: 'The query comes back selected, at the same match. Nothing moves: no new search from the top.' }],
['close2', 10900, { face: 'address', find: false, selected: true, qsel: false, key: 'Esc', line: 'Closed again. The loop restarts.' }]
];
}

run() {
(this.timers || []).forEach((t) => clearTimeout(t));
if ((this.props.autoplay ?? true) === false) return;
this.timers = [];
this.setState({ phase: 'idle', snap: true, still: false });
this.timers.push(setTimeout(() => this.setState({ snap: false }), 80));
this.plan().forEach((p) => {
if (p[1] > 0) this.timers.push(setTimeout(() => this.setState({ phase: p[0] }), p[1]));
});
this.timers.push(setTimeout(() => this.run(), 12300));
}

renderVals() {
const plan = this.plan();
const ph = this.state.phase;
const v = {};
let at = 0;
for (let i = 0; i < plan.length; i += 1) {
Object.assign(v, plan[i][2]);
if (plan[i][0] === ph) { at = plan[i][1]; break; }
}
if (this.state.still && (v.ring === 'a' || v.ring === 'b')) v.ring = 'hold';
const H = 900 / 1495;
const centres = [387.3, 588.5, 756.5, 704, 833.6, 1317.8, 898.2];
const ticks = centres.map((y, i) => ({ y: Math.round(y * H) - 1, c: v.find && v.active === i + 1 ? 'rgb(255,150,50)' : 'rgb(230,190,0)' }));
const s = (at / 1000).toFixed(1);
return {
v: v,
snap: this.state.snap,
thumbTop: Math.round(v.scroll * H),
ticks: ticks,
tickOp: v.find ? 1 : 0,
clock: this.state.still ? 'Still' : s + ' s'
};
}
}
