<script type="text/x-dc" data-dc-script data-props='{"face":{"editor":"enum","default":"pair","options":["pair","capsule"],"section":"Split"},"left":{"editor":"enum","default":"fieldnotes","options":["fieldnotes","tideline","refract","vitre","lec","home"],"section":"Split"},"right":{"editor":"enum","default":"tideline","options":["fieldnotes","tideline","refract","vitre","lec","home"],"section":"Split"},"themeL":{"editor":"enum","default":"light","options":["light","dark","clear"],"section":"Split"},"themeR":{"editor":"enum","default":"dark","options":["light","dark","clear"],"section":"Split"},"bar":{"editor":"enum","default":"auto","options":["auto","light","dark","clear"],"section":"Split"},"focus":{"editor":"enum","default":"left","options":["left","right"],"section":"State"},"hover":{"editor":"enum","default":"none","options":["none","left","right"],"section":"State"},"xHover":{"editor":"boolean","default":false,"section":"State"},"pressed":{"editor":"enum","default":"none","options":["none","left","right"],"section":"State"},"width":{"editor":"int","default":480,"min":360,"max":480,"unit":"px","section":"State"},"loading":{"editor":"enum","default":"none","options":["none","left","right","both"],"section":"State"},"snap":{"editor":"boolean","default":true,"section":"State"},"$preview":{"width":480,"height":44}}'>

const themeR = one(p.themeR, THEMES, 'dark');
const focus = one(p.focus, ['left', 'right'], 'left');
const hover = one(p.hover, ['none', 'left', 'right'], 'none');
const xHover = !!(p.xHover ?? false);
const pressed = one(p.pressed, ['none', 'left', 'right'], 'none');
const loading = one(p.loading, ['none', 'left', 'right', 'both'], 'none');
const snap = !!(p.snap ?? true);
const W = Math.max(360, Math.min(480, Math.round(Number(p.width ?? 480)) || 480));
const S = 'cubic-bezier(0.22, 1, 0.36, 1)';
const tr = (s) => (snap ? 'none' : s);

// Glass tokens: gecko/src/skin/glass.css (theme-light, theme-dark, theme-clear).
const DARK_RIM = 'linear-gradient(165deg, rgba(255,255,255,0.7), rgba(255,255,255,0.12) 30%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.35))';
const T = {
light: { tint: 'linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.22))', hoverTint: 'linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.36))', rim: 'linear-gradient(165deg, rgba(255,255,255,0.95), rgba(255,255,255,0.35) 30%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.8))', shadow: '0 10px 28px rgba(40,30,15,0.14), 0 1px 2px rgba(40,30,15,0.18)', text: '#16181d', icon: 'rgba(22,24,29,0.78)', dim: 'rgba(22,24,29,0.28)', hover: 'rgba(22,24,29,0.06)', press: 'rgba(22,24,29,0.1)', placeholder: 'rgba(22,24,29,0.5)', plate: 'rgba(0,95,184,0.10)', plateIn: 'inset 0 0 0 1px rgba(0,95,184,0.35)', load: '#005fb8', hair: 'rgba(22,24,29,0.12)', textShadow: 'none' },
dark: { tint: 'linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)), rgba(16,16,20,0.3)', hoverTint: 'linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.14)), rgba(16,16,20,0.3)', rim: DARK_RIM, shadow: '0 10px 28px rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.3)', text: '#ffffff', icon: 'rgba(255,255,255,0.85)', dim: 'rgba(255,255,255,0.3)', hover: 'rgba(255,255,255,0.10)', press: 'rgba(255,255,255,0.16)', placeholder: 'rgba(255,255,255,0.6)', plate: 'rgba(76,194,255,0.18)', plateIn: 'inset 0 0 0 1px rgba(76,194,255,0.45)', load: '#4cc2ff', hair: 'rgba(255,255,255,0.12)', textShadow: 'none' },

plate: !focused && (hov || prs),
plateL: x + 2,
plateBg: prs ? t.press : t.hover,
showX: hov,
xL: x + h - 30,
xBg: xHover ? t.hover : 'transparent',
xAria: 'Close ' + side + ' page, ' + NAME[site],
loading: loadOn,
loadL: x + 12,
loadW: Math.max(0, h - 24),
load: t.load
};
};

const fT = B;
const focusLoading = loading === 'both' || loading === focus;

const capHalf = (side) => {
const isL = side === 'left';
const site = isL ? left : right;
return {
x: isL ? 0 : 48,
fx: isL ? 13 : 17,
radius: isL ? '22px 0 0 22px' : '0 22px 22px 0',
fav: favs(site),
aria: NAME[site] + ', ' + side + ' page',
badge: hover === side,
bx: isL ? -5 : 83,
xAria: 'Close ' + side + ' page, ' + NAME[site]
};
};

return {
isPair: face === 'pair',
isCapsule: face === 'capsule',
box: { w: face === 'capsule' ? 96 : W },
lens: { id: 'lens-split-' + W, w: W },
L: L,
B: B,
pair: {
label: 'Split view: ' + NAME[left] + ', left; ' + NAME[right] + ', right',
shadow: shadow,
s: s,
seam: seam,
markL: W - 70,
relL: W - 38
},
plate: {
l: (focus === 'left' ? 70 : s) + 2,
w: h - 4,
bg: fT.plate,
inset: fT.plateIn,
tr: tr('left 240ms ' + S + ', background 150ms ease, box-shadow 150ms ease')
},
halves: [half('left'), half('right')],
nav: {
back: 'Back, ' + focus + ' page',
fwd: 'Forward, ' + focus + ' page',
reload: 'Reload, ' + focus + ' page',
stop: 'Stop, ' + focus + ' page',
isReload: !focusLoading,
isStop: focusLoading
},
cap: {
label: NAME[left] + ' and ' + NAME[right] + ', split view',
tint: hover === 'none' ? L.tint : L.hoverTint
},
capHalves: [capHalf('left'), capHalf('right')]
};
}
}
</script>
</body>
</html>
