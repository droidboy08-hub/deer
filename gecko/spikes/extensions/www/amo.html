<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>mock store</title>
    <style>
      body { font: 15px "Segoe UI", sans-serif; padding: 96px 48px 24px; background: #f4f4f7; }
      .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 560px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
      button { font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 6px; border: 0; background: #0060df; color: #fff; }
      pre { font: 12px Consolas, monospace; color: #444; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Vitre Install Test</h2>
      <p>Mock add-on store page. The button does what the "Add to Firefox" button on addons.mozilla.org does: <code>navigator.mozAddonManager.createInstall({ url })</code> then <code>install.install()</code>.</p>
      <button id="add">Add to Vitre</button>
      <pre id="log"></pre>
    </div>
    <script>
      const out = [];
      const log = (m) => { out.push(m); document.getElementById("log").textContent = out.join("\n"); document.title = "STORE " + out.join(" | "); };
      log("mozAddonManager: " + typeof navigator.mozAddonManager);
      async function go() {
        try {
          const install = await navigator.mozAddonManager.createInstall({ url: location.origin + "/vitre-install.xpi" });
          for (const ev of ["onDownloadStarted", "onDownloadEnded", "onDownloadFailed", "onDownloadCancelled", "onInstallStarted", "onInstallEnded", "onInstallFailed", "onInstallCancelled"]) {
            install.addEventListener(ev, () => log(ev + " state=" + install.state + " error=" + install.error));
          }
          await install.install();
          log("install() resolved");
        } catch (e) {
          log("install() rejected: " + e);
        }
      }
      document.getElementById("add").addEventListener("click", go);
      if (location.hash === "#auto") go();
    </script>
  </body>
</html>
