<?xml version="1.0"?>
<!-- Test page: Vitre as its OWN top-level chrome window on the full Firefox runtime
     (firefox.exe -chrome chrome://vitre/content/pages/ownwindow.xhtml). Not the recommended path. -->
<html xmlns="http://www.w3.org/1999/xhtml" id="vitre-own" windowtype="vitre:own" width="1100" height="720" screenX="60" screenY="60">
  <head>
    <title>Vitre own window (spike)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1f26; color: #eee; font: 14px "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; }
      #bar { padding: 10px 14px; background: #2b3040; }
      #content { flex: 1; min-height: 0; }
      #content > * { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="bar">own top-level window, full browser runtime (-chrome) · <span id="status">starting</span></div>
    <div id="content"></div>
    <script src="chrome://vitre/content/pages/ownwindow.js"></script>
  </body>
</html>
