<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hit: none</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23e5484d'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; font: 14px "Segoe UI", sans-serif; background: #f4f1ea; color: #1b1d21; }
  .stripe { position: fixed; left: 0; right: 0; top: 0; height: 68px; background: repeating-linear-gradient(90deg, #ffd9a8 0 40px, #ffe9cf 40px 80px); }
  .stripe span { position: absolute; left: 12px; top: 26px; font-weight: 600; }
  main { padding: 96px 32px; }
  select, input, button { font: inherit; padding: 6px 10px; margin-right: 12px; }
  #log { margin-top: 16px; white-space: pre; font-family: Consolas, monospace; }
</style>
</head>
<body>
<div class="stripe"><span>page content under the bar strip (y 0-68): clicks here must reach the page</span></div>
<main>
  <p>
    <select id="sel"><option>Alpha</option><option>Bravo</option><option>Charlie</option><option>Delta</option></select>
    <input id="ac" name="city" list="cities" placeholder="datalist field">
    <datalist id="cities"><option value="Lisbon"><option value="Lima"><option value="Lyon"></datalist>
    <button id="geo">Ask for location</button>
    <button id="fs">Video full screen</button>
  </p>
  <video id="v" width="320" height="180" style="background:#234" controls></video>
  <div id="log"></div>
</main>
<script>
  const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
  addEventListener('click', (e) => { document.title = `hit: ${e.clientX},${e.clientY} ${e.target.id || e.target.className || e.target.localName}`; log(document.title); });
  document.getElementById('geo').addEventListener('click', () => navigator.geolocation.getCurrentPosition(() => log('geo ok'), (e) => log('geo ' + e.message)));
  document.getElementById('fs').addEventListener('click', () => document.getElementById('v').requestFullscreen().then(() => log('fs ok'), (e) => log('fs ' + e)));
  document.addEventListener('fullscreenchange', () => { document.title = 'fullscreen: ' + (document.fullscreenElement ? document.fullscreenElement.id : 'none'); });
  if (location.hash === '#geo') navigator.geolocation.getCurrentPosition(() => log('geo ok'), (e) => log('geo ' + e.message));
  if (location.hash === '#fs') document.getElementById('v').requestFullscreen().then(() => log('fs ok'), (e) => { document.title = 'fs failed: ' + e; });
</script>
</body>
</html>
