<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- A page whose CSP forbids inline styles (no 'unsafe-inline' in style-src), like the Firefox PDF
     viewer (style-src resource: chrome:) and strict-CSP sites. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self' data:">
<title>Strict CSP page</title>
<link rel="stylesheet" href="csp.css">
</head>
<body>
<div class="band"><span>STRICT CSP PAGE (style-src 'self') 0123456789</span></div>
<p>Stained glass refracts light through coloured panes; the lead came holds each piece. Stained glass refracts light through coloured panes; the lead came holds each piece.</p>
</body>
</html>
