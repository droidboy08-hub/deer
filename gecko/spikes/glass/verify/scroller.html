<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nested scroller test page</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 600 22px/30px 'Segoe UI', sans-serif; }
  /* App-shell layout: the document itself does not scroll, an inner element does (Gmail, Slack, docs
     viewers, the Firefox PDF viewer...). ?kind= picks how the scroller is built. */
  #scroller { position: absolute; inset: 0; overflow: auto; }
  body.fixed #scroller { position: fixed; }
  body.wc #scroller { will-change: transform; }
  body.contain #scroller { contain: strict; }
  .band { height: 260px; background: repeating-linear-gradient(90deg, #e6194b 0 40px, #f58231 40px 80px, #ffe119 80px 120px, #3cb44b 120px 160px, #42d4f4 160px 200px, #4363d8 200px 240px, #911eb4 240px 280px, #ffffff 280px 320px, #000000 320px 360px); position: relative; }
  .band span { position: absolute; left: 20px; top: 12px; background: rgba(255,255,255,0.9); padding: 2px 10px; }
  .text { padding: 14px 24px; columns: 3; font: 400 15px/22px Georgia, serif; background: #fff; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const kind = q.get('kind') || 'abs';
  document.title = 'scroller ' + kind;
  const words = 'Stained glass refracts light through coloured panes; the lead came holds each piece. ';
  let inner = '';
  for (let i = 0; i < 8; i++) inner += `<div class="band"><span>NESTED SCROLLER (${kind}) STRIPES ${i} 0123456789</span></div><div class="text">${words.repeat(14)}</div>`;
  if (kind === 'iframe') {
    // Same-origin iframe filling the viewport: the scrolling happens in a sub-document.
    document.body.innerHTML = `<iframe srcdoc="${('<style>html,body{margin:0;font:600 22px/30px Segoe UI,sans-serif}' + document.querySelector('style').textContent.replace(/"/g, "'") + '</style>' + inner).replace(/"/g, '&quot;')}"></iframe>`;
  } else {
    document.body.className = kind;
    document.body.innerHTML = `<div id="scroller">${inner}</div>`;
    const s = document.getElementById('scroller');
    const speed = Number(q.get('scroll') || 0);
    if (speed) (function tick() { s.scrollTop += speed; requestAnimationFrame(tick); })();
  }
</script>
</body>
</html>
