<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glass test page</title>
<style>
  html, body { margin: 0; }
  body { font: 600 22px/30px 'Segoe UI', sans-serif; color: #111; }
  body.white { background: #fff; }
  body.white .band, body.white .grid, body.white #anim, body.white #vid { display: none; }
  body.dark { background: #15161a; color: #e8e8ea; }
  body.dark .band, body.dark .grid, body.dark #anim, body.dark #vid { display: none; }
  .band {
    height: 260px;
    background:
      repeating-linear-gradient(90deg, #e6194b 0 40px, #f58231 40px 80px, #ffe119 80px 120px, #3cb44b 120px 160px, #42d4f4 160px 200px, #4363d8 200px 240px, #911eb4 240px 280px, #ffffff 280px 320px, #000000 320px 360px);
    position: relative;
  }
  .band.b2 { background: repeating-linear-gradient(0deg, #111 0 6px, #fff 6px 20px); height: 180px; }
  .band.b3 { background: repeating-conic-gradient(#222 0 25%, #f4f4f4 0 50%) 0 0 / 40px 40px; height: 220px; }
  .band.b4 { background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #7b2ff7, #00c853); height: 200px; }
  .band span { position: absolute; left: 20px; top: 12px; background: rgba(255,255,255,0.9); padding: 2px 10px; color: #000; }
  .text { padding: 14px 24px; columns: 3; font: 400 15px/22px Georgia, serif; }
  .grid { height: 240px; background:
      linear-gradient(#0a58ca 2px, transparent 2px) 0 0 / 100% 24px,
      linear-gradient(90deg, #d63384 2px, transparent 2px) 0 0 / 24px 100%, #fffbe6; }
  #anim { position: fixed; left: 0; top: 150px; width: 120px; height: 60px; background: #00e676; border: 6px solid #000; animation: slide 2s linear infinite alternate; z-index: 3; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(1100px); } }
  #vid { position: fixed; left: 420px; top: 20px; width: 480px; height: 150px; object-fit: fill; background: #000; z-index: 2; display: none; }
  #frame { position: fixed; right: 8px; bottom: 8px; background: #000; color: #0f0; font: 14px monospace; padding: 2px 6px; z-index: 5; }
</style>
</head>
<body>
<div id="anim"></div>
<video id="vid" muted loop playsinline></video>
<div id="frame">0</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('bg')) document.body.className = q.get('bg');
  if (q.get('noanim')) document.getElementById('anim').style.display = 'none';
  const words = 'Stained glass refracts light through coloured panes; the lead came holds each piece. ';
  let html = '';
  for (let i = 0; i < 12; i++) {
    html += `<div class="band"><span>STRIPES ${i} The quick brown fox jumps over the lazy dog 0123456789</span></div>`;
    html += `<div class="text">${words.repeat(14)}</div>`;
    html += `<div class="band b2"><span>HORIZONTAL LINES ${i}</span></div>`;
    html += `<div class="grid"></div>`;
    html += `<div class="band b3"><span>CHECKER ${i}</span></div>`;
    html += `<div class="band b4"><span>GRADIENT ${i}</span></div>`;
  }
  document.body.insertAdjacentHTML('beforeend', html);

  // Frame counter and optional auto-scroll, so chrome captures can prove the backdrop is live.
  let n = 0;
  const speed = Number(q.get('scroll') || 0);
  const frame = document.getElementById('frame');
  function tick() {
    n++;
    frame.textContent = n + ' y=' + Math.round(scrollY);
    if (speed) scrollBy(0, speed);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Optional real <video>: record a canvas animation to WebM, then play the blob in a video element.
  if (q.get('video')) {
    const c = document.createElement('canvas');
    c.width = 480; c.height = 150;
    const ctx = c.getContext('2d');
    let t = 0;
    const draw = () => {
      t++;
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = `hsl(${(i * 30 + t * 6) % 360} 90% 50%)`;
        ctx.fillRect(i * 40, 0, 40, 150);
      }
      ctx.fillStyle = '#000';
      ctx.font = 'bold 40px sans-serif';
      ctx.fillText('VIDEO ' + t, 20 + (t * 4) % 200, 90);
    };
    const stream = c.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = () => {
      const v = document.getElementById('vid');
      v.src = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      v.style.display = 'block';
      v.play().then(() => document.title = 'video-playing').catch((e) => document.title = 'video-error ' + e);
    };
    rec.start();
    const iv = setInterval(draw, 33);
    setTimeout(() => { clearInterval(iv); rec.stop(); }, 2000);
  }
</script>
</body>
</html>
