<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialog</title>
<style>body{font:17px/1.6 "Segoe UI",sans-serif;margin:0;padding:24px 48px;background:#fbfaf7;color:#1b1b1f}</style></head>
<body>
<h1>A page with a dialog</h1>
<p id="p1">Plain glass text before the <button id="open">dialog</button>.</p>
<dialog id="dlg"><p>The dialog holds a glass word too.</p><button id="close">Close</button></dialog>
<script>
  window.dialogEsc = 0;
  document.getElementById('open').onclick = () => document.getElementById('dlg').showModal();
  document.getElementById('dlg').addEventListener('cancel', () => window.dialogEsc++);
</script>
</body></html>
