<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Opens a popup</title>
<style>body{font:17px/1.6 "Segoe UI",sans-serif;margin:0;padding:24px 48px;background:#fbfaf7;color:#1b1b1f}</style></head>
<body>
<h1>Popup opener</h1>
<p><button id="pop">Open a popup</button> with glass in it.</p>
<script>
  document.getElementById('pop').onclick = () => window.open('article.html', 'vpop', 'popup,width=760,height=560');
</script>
</body></html>
