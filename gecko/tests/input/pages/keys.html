<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>[]</title>
<style>
  body { font: 14px/1.5 "Segoe UI", sans-serif; margin: 96px 24px 24px; background: #f4f1ea; color: #222; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #log { white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; background: #fff; border: 1px solid #ccc; padding: 8px; min-height: 60px; }
  input, textarea { font: inherit; padding: 4px 6px; margin-right: 8px; }
  #fs { background: #234; color: #fff; padding: 12px; margin-top: 8px; }
  #pop { padding: 12px; border: 1px solid #888; }
</style>
</head>
<body>
<h1 id="h">keys test page</h1>
<p id="mode"></p>
<p>
  <input id="field" placeholder="page input" value="hello world">
  <textarea id="area" rows="1">area</textarea>
  <button id="acc" accesskey="g">accesskey g</button>
  <a id="link" href="https://example.com/">a link</a>
</p>
<dialog id="dlg"><p>modal dialog</p><button id="dlgbtn">ok</button></dialog>
<div id="pop" popover>a popover</div>
<div id="fs" tabindex="0">full screen target</div>
<div id="log"></div>
<script>
// The page mirrors every key event it sees into document.title (JSON), which the test reads from
// the parent process as browser.contentTitle.
//   ?prevent=ctrl-k,ctrl-l  preventDefault on those keydowns ("*" = every keydown)
//   ?preventpress=x         preventDefault on those keypress events only (Gecko sends pages no keypress for Ctrl chords)
//   ?acc=d                  the button's accesskey
//   ?focus=field            focus that element on load
//   ?iframe=https://...     embed a cross-site (out-of-process) frame
const q = new URLSearchParams(location.search);
const prevent = (q.get("prevent") || "").split(",").filter(Boolean);
const preventPress = (q.get("preventpress") || "").split(",").filter(Boolean);
if (q.get("acc")) document.getElementById("acc").accessKey = q.get("acc");
const seen = [];
document.getElementById("mode").textContent = "this page calls preventDefault on keydown: " + (prevent.join(", ") || "(nothing)") + (preventPress.length ? "; on keypress: " + preventPress.join(", ") : "");
function name(e) {
  return (e.ctrlKey ? "ctrl-" : "") + (e.altKey ? "alt-" : "") + (e.shiftKey ? "shift-" : "") + (e.metaKey ? "meta-" : "") + e.key.toLowerCase();
}
function publish() {
  document.title = JSON.stringify(seen);
  document.getElementById("log").textContent = seen.join("  ");
}
for (const type of ["keydown", "keypress", "keyup"]) {
  addEventListener(type, (e) => {
    const n = name(e);
    let flags = "";
    if (type === "keydown" && (prevent.includes(n) || prevent.includes("*"))) { e.preventDefault(); flags += "!"; }
    if (type === "keypress" && preventPress.includes(n)) { e.preventDefault(); flags += "!"; }
    if (e.repeat) flags += "R";
    if (e.isComposing) flags += "C";
    if (e.keyCode === 229) flags += "P";
    if (e.getModifierState("AltGraph")) flags += "G";
    seen.push({ keydown: "d", keypress: "p", keyup: "u" }[type] + ":" + n + flags);
    publish();
  }, true);
}
for (const type of ["compositionstart", "compositionend"]) addEventListener(type, () => { seen.push(type); publish(); }, true);
document.getElementById("acc").addEventListener("click", () => { seen.push("accesskey-click"); publish(); });
document.getElementById("dlg").addEventListener("close", () => { seen.push("dialog-closed"); publish(); });
document.getElementById("pop").addEventListener("toggle", (e) => { seen.push("popover:" + e.newState); publish(); });
document.addEventListener("fullscreenchange", () => { seen.push("fullscreen:" + (document.fullscreenElement ? "on" : "off")); publish(); });
document.addEventListener("fullscreenerror", () => { seen.push("fullscreenerror"); publish(); });
function openDialog() { document.getElementById("dlg").showModal(); return document.getElementById("dlg").open; }
function openPopover() { document.getElementById("pop").showPopover(); return document.getElementById("pop").matches(":popover-open"); }
function goFull(lock) {
  const el = document.getElementById("fs");
  const p = lock ? el.requestFullscreen({ keyboardLock: "browser" }) : el.requestFullscreen();
  p.catch((e) => { seen.push("fs-rejected:" + e.name); publish(); });
  return "requested";
}
if (q.get("iframe")) {
  const f = document.createElement("iframe");
  f.id = "frame"; f.src = q.get("iframe"); f.style.cssText = "width:500px;height:160px;border:1px solid #999;display:block;margin-top:8px";
  document.body.appendChild(f);
}
if (q.get("focus")) document.getElementById(q.get("focus")).focus();
publish();
</script>
</body>
</html>
