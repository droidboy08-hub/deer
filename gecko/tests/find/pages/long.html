<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Long glass page</title>
<style>
  body { font: 16px/1.6 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #1b1b1f; background: #ffffff; margin: 0; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 32px 200px; }
  h2 { margin: 28px 0 6px; font-size: 20px; }
</style>
</head>
<body>
<main id="main"><h1>A long page about glass</h1></main>
<script>
  // ?n=600 paragraphs, each with two "glass" (1,200 matches: past Firefox's count limit of 1,000) and
  // one "ribbon" every tenth paragraph.
  const n = Number(new URLSearchParams(location.search).get('n') || 600);
  const main = document.getElementById('main');
  for (let i = 1; i <= n; i++) {
    if (i % 50 === 1) {
      const h = document.createElement('h2');
      h.id = 's' + i;
      h.textContent = 'Section ' + i;
      main.append(h);
    }
    const p = document.createElement('p');
    p.id = 'p' + i;
    p.textContent = 'Paragraph ' + i + ': float glass leaves the tin bath, and the glass cools slowly' + (i % 10 === 0 ? ' along the ribbon.' : '.');
    main.append(p);
  }
</script>
</body>
</html>
