<!doctype html>
<meta charset="utf-8">
<title>Opener</title>
<body style="margin:0;background:#f4f1ea;font:16px Segoe UI,sans-serif">
<p style="margin:120px 40px"><a id="a" href="#" style="display:inline-block;width:300px;height:80px;background:#246;color:#fff">open a popup</a></p>
<script>
document.getElementById("a").addEventListener("click", (e) => {
  e.preventDefault();
  window.open("b.html", "p", "width=420,height=320");
});
</script>
</body>
