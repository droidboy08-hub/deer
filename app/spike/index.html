<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
webview{position:absolute;inset:0;width:100%;height:100%}
.pill{position:absolute;left:480px;top:40px;width:480px;height:44px;border-radius:22px;box-shadow:0 10px 28px rgba(40,30,15,.14),0 1px 2px rgba(40,30,15,.18)}
.pill .lens{position:absolute;inset:0;border-radius:22px;backdrop-filter:url(#lens)}
.pill .tint{position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.22))}
.pill .label{position:relative;line-height:44px;text-align:center;font:500 13.5px 'Segoe UI Variable Text','Segoe UI',sans-serif;color:#16181d}
.blur{position:absolute;left:480px;top:120px;width:480px;height:44px;border-radius:22px;backdrop-filter:blur(12px);background:rgba(255,255,255,.3)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="lens" x="0" y="0" width="480" height="44" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feImage id="map" x="0" y="0" width="480" height="44" preserveAspectRatio="none" result="map"></feImage>
<feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="soft"></feGaussianBlur>
<feDisplacementMap in="soft" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
</filter></defs></svg>
<webview src="page.html"></webview>
<div class="pill"><div class="lens"></div><div class="tint"></div><div class="label">fieldnotes.press — lens over webview</div></div>
<div class="blur"></div>
<script>
// Lens map: rounded-rect SDF, inward normal offsets in R/G with (1-t)^2.2 falloff across the bezel.
function lensMap(w, h, r, bezel, power) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const px = x + 0.5 - w / 2, py = y + 0.5 - h / 2;
    const qx = Math.abs(px) - (w / 2 - r), qy = Math.abs(py) - (h / 2 - r);
    const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
    const d = Math.min(Math.max(qx, qy), 0) + Math.hypot(ox, oy) - r; // <0 inside
    const t = Math.min(1, Math.max(0, -d / bezel));
    const k = Math.pow(1 - t, power);
    let nx = 0, ny = 0;
    if (qx > 0 || qy > 0) { const l = Math.hypot(ox, oy) || 1; nx = Math.sign(px) * ox / l; ny = Math.sign(py) * oy / l; }
    else if (qx > qy) nx = Math.sign(px); else ny = Math.sign(py);
    const i = (y * w + x) * 4;
    img.data[i] = Math.round(128 - nx * k * 127);
    img.data[i + 1] = Math.round(128 - ny * k * 127);
    img.data[i + 2] = 128; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); return c.toDataURL();
}
document.getElementById('map').setAttribute('href', lensMap(480, 44, 22, 14, 2.2));
console.log('lens ready');
</script>
</body></html>
